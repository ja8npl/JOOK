<!doctype html>
<html lang="de" style="background-color: #0e0f13;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f13" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym Log" />
    <meta name="description" content="Gym Log für Übungen, Einstellungen, Sätze und Fortschritt." />
    <style>
      /* Kritisches Inline-CSS: verhindert den weißen Blitz vor dem ersten Paint,
         solange App-CSS (und damit --bg-base) noch nicht geladen ist. Muss mit dem
         Launch-Hintergrund übereinstimmen (iOS-Splash-PNGs, .splash-intro: #0e0f13). */
      html, body { background: #0e0f13; color-scheme: dark; margin: 0; }
      #root { background: #0e0f13; min-height: 100vh; }
    </style>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('gymlog.theme');
          const theme = ['garmin', 'bordeaux', 'whoop', 'ember'].includes(stored || '') ? stored : 'garmin';
          document.documentElement.dataset.theme = theme;
          // V2: jedes Theme hat eigene --bg-base (Near-Black mit Farbstich) —
          // Status-Bar und Boot-Flash folgen dem Theme.
          const bgByTheme = { garmin: '#0e0f13', bordeaux: '#110d10', whoop: '#0b0b0d', ember: '#12100e' };
          const bgColor = bgByTheme[theme] ?? '#0e0f13';
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bgColor);
          document.documentElement.style.backgroundColor = bgColor;
        } catch {
          document.documentElement.dataset.theme = 'garmin';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1284x2778.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1260x2736.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1170x2532.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/splash-1125x2436.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/splash-750x1334.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Gym Log</title>
  </head>
  <body style="background-color: #0e0f13; margin: 0;">
    <div id="root" style="background-color: #0e0f13; min-height: 100vh;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
